name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "slides/**"
      - "public/images/kyakumap-demo-thumbnail.png"
      - "public/videos/kyakumap-demo.mp4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Marp presentation
        run: |
          mkdir -p dist/images dist/videos
          npx --yes @marp-team/marp-cli@4.2.3 \
            slides/pitch.md \
            --theme slides/theme.css \
            --html \
            --output dist/index.html
          cp public/images/kyakumap-demo-thumbnail.png dist/images/
          cp public/videos/kyakumap-demo.mp4 dist/videos/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
